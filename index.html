<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faith & Flow — Sign in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="petal-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0"></canvas>
<div class="auth-page" style="position:relative;z-index:1">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="flower logo-bloom">🌸</div>
      <h1>Faith & Flow</h1>
      <p>Your daily spiritual rhythm, beautifully tracked.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('login')">Sign in</button>
      <button class="auth-tab" onclick="showTab('register')">Create account</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- Login form -->
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
      </div>
      <div class="form-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" required />
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
      <button type="button" style="width:100%;margin-top:8px;background:none;border:none;color:var(--mauve);font-size:.82rem;cursor:pointer;padding:6px;font-family:var(--sans)" onclick="showTab('forgot')">Forgot password?</button>
    </form>

    <!-- Forgot password form -->
    <div id="forgot-form" style="display:none">
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:14px;line-height:1.55">Enter your email and new password below. This works as long as you're on the same device — your account is stored locally.</p>
      <div class="form-field">
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" placeholder="you@example.com" required />
      </div>
      <div class="form-field">
        <label for="forgot-new-pass">New password</label>
        <input type="password" id="forgot-new-pass" placeholder="At least 6 characters" minlength="6" required />
      </div>
      <button type="button" class="btn-primary" onclick="doReset()">Reset password</button>
      <button type="button" style="width:100%;margin-top:8px;background:none;border:none;color:var(--mauve);font-size:.83rem;cursor:pointer;padding:6px;font-family:var(--sans)" onclick="showTab('login')">← Back to sign in</button>
    </div>

    <!-- Register form -->
    <form id="register-form" style="display:none" onsubmit="doRegister(event)">
      <div class="form-field">
        <label for="reg-name">Your name</label>
        <input type="text" id="reg-name" placeholder="e.g. Rhema" required />
      </div>
      <div class="form-field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required />
      </div>
      <div class="form-field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters" minlength="6" required />
      </div>
      <button type="submit" class="btn-primary">Create my account</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  // Floating petals
  (function(){
    const canvas = document.getElementById('petal-canvas');
    const ctx = canvas.getContext('2d');
    const petals = [];
    const EMOJIS = ['🌸','🌺','✿','❀','🌷','✦','⋆'];
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for (let i = 0; i < 18; i++) {
      petals.push({
        x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
        size: 10+Math.random()*12, speedY: .18+Math.random()*.4,
        speedX: (Math.random()-.5)*.22, rot: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-.5)*.013, opacity: .1+Math.random()*.2,
        emoji: EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
        wobble: Math.random()*Math.PI*2, wobbleSpeed: .01+Math.random()*.018,
      });
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      petals.forEach(p=>{
        ctx.save(); ctx.globalAlpha=p.opacity;
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.font=`${p.size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.emoji,0,0); ctx.restore();
        p.y+=p.speedY; p.x+=p.speedX+Math.sin(p.wobble)*.22;
        p.rot+=p.rotSpeed; p.wobble+=p.wobbleSpeed;
        if(p.y>canvas.height+20){ p.y=-20; p.x=Math.random()*canvas.width; }
        if(p.x<-20) p.x=canvas.width+20;
        if(p.x>canvas.width+20) p.x=-20;
      });
      requestAnimationFrame(draw);
    }
    draw();
  })();
</script>
<script>
  // Redirect if already logged in
  if (Auth.currentUser()) window.location.href = 'pages/dashboard.html';

  function showTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0) === (tab === 'login'));
    });
    document.getElementById('login-form').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('forgot-form').style.display   = tab === 'forgot'   ? '' : 'none';
    document.getElementById('auth-error').classList.remove('show');
  }

  function doReset(e) {
    const email = document.getElementById('forgot-email').value.trim().toLowerCase();
    const newPass = document.getElementById('forgot-new-pass').value;
    if (!email || newPass.length < 6) { showError('Please fill in all fields (password min 6 chars).'); return; }
    const res = Auth.resetPassword(email, newPass);
    if (res.ok) {
      showError('');
      document.getElementById('auth-error').style.background = '#D8F3E8';
      document.getElementById('auth-error').style.color = '#2A7A52';
      document.getElementById('auth-error').textContent = 'Password reset! You can now sign in.';
      document.getElementById('auth-error').classList.add('show');
      setTimeout(() => showTab('login'), 2000);
    } else {
      showError(res.error);
    }
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.add('show');
  }

  function doLogin(e) {
    e.preventDefault();
    const res = Auth.login(
      document.getElementById('login-email').value,
      document.getElementById('login-password').value
    );
    if (res.ok) window.location.href = 'pages/dashboard.html';
    else showError(res.error);
  }

  function doRegister(e) {
    e.preventDefault();
    const res = Auth.register(
      document.getElementById('reg-name').value,
      document.getElementById('reg-email').value,
      document.getElementById('reg-password').value
    );
    if (res.ok) window.location.href = 'pages/dashboard.html';
    else showError(res.error);
  }
</script>
</body>
</html>
